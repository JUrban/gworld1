<P>(FP21) (E.Zelmanov) Let F_n be the free group of rank n,
and P_m the subgroup of F_n generated by  <i>m</i>th
powers of all <i>primitive elements</i> of F_n.
(This subgroup is obviously normal in F_n).
Is it true that the factor group &nbsp;  BP(n, m) = F_n/P_m &nbsp;
 is NOT  residually finite for sufficiently large <i>m</i> ?
