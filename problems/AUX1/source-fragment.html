 (cf. Problem <A HREF="probout.html#(O9)">(O9)</A>)
&nbsp; Let  m, n be positive integers, and  H and K  nontrivial subgroups of a free group
such that rank(H) = n and rank(K) = m.
Which numbers  between 1 and
 (n-1)(m-1) can be realized as rank(H \cap K) - 1?
  In particular, can (n-1)(m-1) - 1 be realized?
