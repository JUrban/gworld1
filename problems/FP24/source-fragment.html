<P><A NAME="(FP24)"></A>(FP24) (V.Guba) Let k[F] be  the group ring of Thompson's group F
(see Problem (FP23)) over a field k.&nbsp; Does k[F] satisfy the Ore condition?
That is, for any a, b \in k[F], are there nonzero  u, v \in k[F]
such that  au = bv ? (If the answer is negative, then F is not
amenable.) <!-- <A HREF="Back2.html#(FP24)">
Background</A>-->
