<P><FONT COLOR="#CA0000">*<A NAME="(O9)"></A>(O9) The Hanna Neumann conjecture.</FONT> If H
and K are nontrivial subgroups of a free group, then rank(H \cap K) - 1
\le (rank(H) - 1)(rank(K) - 1). <A HREF="Back.html#(O9)">Background</A>
