<P><FONT COLOR="#CC0000">(O2) The Burnside problem. </FONT>For what values
of n are all groups of exponent n locally finite? Of particular interest
are n=5, n=8, n=9 and n=12 - values for which, by the experts' opinion,
groups of exponent n have a remote chance of being locally finite. <A
