<P><FONT COLOR="#FF0000">*<A NAME="(H14)"></A></FONT>(H14) (A.Miasnikov) We call a subgroup&nbsp; H&nbsp; of a group&nbsp;
G&nbsp; malnormal if for any element&nbsp; g&nbsp; in G, but not in H,
one has&nbsp; H^g \cap H&nbsp; = {1}.&nbsp; Is this property algorithmically
decidable for finitely generated subgroups of hyperbolic groups?&nbsp;
